# Doc 77, Phase 0: the desktop client's spike on Windows (WebView2). DRAFT, UNTESTED: written on Linux and never run.
# The spike's app was replaced by the real client in Phase 3, so this checks out the Phase 0 commit (the tag
# desktop-spike-phase0, b7aed3d) and runs the spike from there, whatever branch it is started on.
#
# GitHub offers "Run workflow" only for a workflow file on the default branch (codex/mvp-foundation), and the tag must be
# pushed (git push origin desktop-spike-phase0). Until this file is on the default branch, building on the PC (doc 77,
# Phase 0's Windows steps) is the way.
# Started by hand only (Actions tab, "Run workflow"), so pushing this file runs nothing.
#
# It builds Desktop/ for Windows, then runs the spike there: the stand-in world (spike/ws_server.mjs) on loopback and
# on the runner's own non-loopback address, and the client once, which runs the page's transport tests and quits.
# Uploads the installer, the bare .exe, and the results (spike/out/*.jsonl). Whether a GitHub runner can show a
# WebView2 window at all is part of what this finds out; the user's own PC is the real check (doc 77, Phase 0).
name: desktop-windows (spike, untested)

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-spike-phase0   # The Phase 0 commit (b7aed3d): the spike's app and page. Push the tag first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri
      - run: npm ci
      - name: Build (release, NSIS installer)
        run: npx tauri build --bundles nsis
      - name: Run the spike
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force spike/out | Out-Null
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          Write-Host "non-loopback address: $ip"
          # The wss:// part needs spike/make_certs.sh (bash + openssl, both on the runner through Git for Windows).
          bash spike/make_certs.sh
          $server = Start-Process node -ArgumentList "spike/ws_server.mjs","--lan",$ip,"--for","900" -PassThru -RedirectStandardOutput spike/out/server.log -RedirectStandardError spike/out/server.err
          Start-Sleep 2
          $env:SPIKE_LAN = "ws://${ip}:47811"
          $env:SPIKE_REPORT = "$PWD/spike/out/windows.jsonl"
          $env:SPIKE_QUIT = "1"
          $env:SPIKE_CA = "$PWD/spike/out/ca.pem"
          $app = Start-Process src-tauri/target/release/ratw-desktop.exe -PassThru -RedirectStandardOutput spike/out/windows.stdout
          if (-not $app.WaitForExit(600000)) { Stop-Process $app -Force; Write-Host "the client did not finish in 10 minutes" }
          Stop-Process $server -Force
          Get-Content spike/out/windows.jsonl -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ratw-desktop-windows-spike
          path: |
            Desktop/src-tauri/target/release/ratw-desktop.exe
            Desktop/src-tauri/target/release/bundle/nsis/*.exe
            Desktop/spike/out/*.jsonl
            Desktop/spike/out/*.stdout
            Desktop/spike/out/*.log
