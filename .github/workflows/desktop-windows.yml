# Docs 76/77/78: the desktop client on Windows (WebView2), a test build. Started by hand only (Actions tab, "Run
# workflow"), so pushing this file runs nothing; the jobs check out the branch or tag they are given. Releases for
# players are made by Slop Build (slop.yml): the game has no installer of its own, SLAPorSLOP installs and updates it.
#
# Two jobs:
# - client: the desktop client from a branch (default ridgemere2): Client/ and Editor/ built and built in, `cargo test`
#   and the release build. Uploads the program (ratw-desktop.exe) for a Windows PC.
# - scripts: the world folder's restore.bat and reset-editor-password.bat (doc 78, M5) in cmd.exe from the same branch,
#   against a stand-in docker.exe (Package/testdata/windows-scripts.ps1): every step, refusals, and typed input cmd
#   could read as a command.

name: desktop-windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag for the real client"
        default: ridgemere2
        required: true

jobs:
  client:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri
      - run: npm run setup
      - name: Build the pages (the shell's tests and build need Client/dist and Editor/dist, which is built in)
        run: npm --prefix ../Editor run build && npm --prefix ../Client run build
      - name: Shell tests
        run: npm test
      - name: "Build (release; no installer of its own: SLAPorSLOP installs and updates the game)"
        run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ratw-desktop-windows
          path: |
            Desktop/src-tauri/target/release/ratw-desktop.exe

  scripts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: The host's .bat scripts in cmd.exe (Docs/Design/78, M5)
        shell: pwsh
        run: ./Package/testdata/windows-scripts.ps1

