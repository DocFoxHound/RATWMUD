# Doc 78, Phase M0a: the Editor's spike (Desktop/spike-editor) on Windows, and Docker Engine's peer addresses on Linux.
# Started by hand only (Actions tab, "Run workflow", or `gh workflow run editor-spike.yml -f ref=BRANCH`), so pushing
# this file runs nothing. GitHub offers "Run workflow" only for a workflow file on the default branch
# (codex/mvp-foundation); the jobs check out the branch or tag they are given (default r2-editor-m0a).
#
# - windows: the reserved port ranges, Hyper-V/WSL/Docker on the runner (windows_facts.ps1); the studio app built; the
#   spike app against world_stub.py on WebView2, incognito pair first and then the persistent pair first. Uploads the
#   results (*.jsonl, windows-facts.txt), never the throwaway key.
# - linux-docker: docker_peer.sh on the runner's rootful Docker Engine, with a network namespace standing in for
#   another computer on the LAN.

name: editor-spike

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag with Desktop/spike-editor"
        default: r2-editor-m0a
        required: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop/spike-editor
      - name: Facts (reserved ports, Hyper-V, WSL, Docker)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          ./Desktop/spike-editor/windows_facts.ps1 | Tee-Object out/windows-facts.txt
      - name: Build the studio app (Editor/dist)
        working-directory: Editor
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build the spike
        working-directory: Desktop/spike-editor
        run: cargo build
      - name: Run the spike
        shell: pwsh
        continue-on-error: true
        run: |
          $out = (Resolve-Path out).Path
          bash Desktop/spike-editor/make_cert.sh out
          $env:SPIKE_PIN = (Get-Content out/pin.txt).Trim()
          $stub = Start-Process python -ArgumentList "Desktop/spike-editor/world_stub.py","--cert","out/cert.pem","--key","out/key.pem","--dist","Editor/dist","--for","2400" -PassThru -RedirectStandardOutput out/stub.log -RedirectStandardError out/stub.err
          Start-Sleep 8
          foreach ($order in 'ppii', 'iipp', 'ddp') {
            $env:SPIKE_ROUNDS = $order
            $env:SPIKE_REPORT = "$out/windows-$order.jsonl"
            $env:SPIKE_QUIT = "1"
            $env:SPIKE_DEADLINE = "460"
            $app = Start-Process Desktop/spike-editor/target/debug/ratw-editor-spike.exe -PassThru -RedirectStandardOutput "out/app-$order.out" -RedirectStandardError "out/app-$order.err"
            if (-not $app.WaitForExit(520000)) { Stop-Process $app -Force; Write-Host "the spike did not finish ($order)" }
          }
          Stop-Process $stub -Force
          Get-Content out/windows-*.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-spike-windows
          path: |
            out/*.jsonl
            out/*.txt
            out/*.log
            out/*.out
            out/*.err

  linux-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Peer addresses and IPv6 through rootful Docker Engine
        run: bash Desktop/spike-editor/docker_peer.sh 2>&1 | tee docker-peer.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-spike-linux-docker
          path: docker-peer.txt
