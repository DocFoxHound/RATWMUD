# SLAPorSLOP's Slop Build (https://slaporslop.games/publishing.md, Option B; Docs/Publishing-on-SLAPorSLOP.md): the
# desktop client (Desktop/, a Tauri 2 shell) for Windows (.zip) and Linux (.tar.gz, .deb, .rpm), built on GitHub's
# runners from this repository, signed with GitHub artifact attestations and checked (Microsoft Defender, gitleaks,
# OSV-Scanner).
#
# The pages the shell builds in live outside Desktop/: build-command (run in Desktop/ after its `npm ci`) installs and
# builds the Editor's page and the game's page first, as desktop-windows.yml does (`npm run setup`, then the builds);
# `tauri build` then embeds Client/dist (frontendDist) and Editor/dist (build.rs). The shared recipe installs WebKitGTK
# and GTK on Linux itself.
#
# It publishes: a `v*` tag (git tag v0.1.1 && git push origin v0.1.1) makes a GitHub release with the files and sends
# it to SLAPorSLOP, as does Run workflow on the Actions tab. Pushes to ridgemere2 don't publish (every push would be a
# release for players); to try a build without publishing, run it by hand with `publish` set to false.
name: Slop Build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish (a release, sent to SLAPorSLOP); false builds and checks only"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  slop:
    uses: DocFoxHound/slop-build/.github/workflows/build.yml@v1
    with:
      app: run-against-the-world
      slop-url: https://slaporslop.games
      project-type: tauri
      project-path: Desktop
      build-command: npm --prefix ../Client ci && npm --prefix ../Editor ci && npm --prefix ../Editor run build && npm --prefix ../Client run build
      platforms: windows,linux
      linux-packages: deb,rpm
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
