[package]
name = "ratw-desktop"
version = "0.0.1"
description = "Run Against the World: the desktop client (docs 76 and 77)."
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "ratw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The end-to-end hook (src/e2e.rs, Desktop/tests/app.test.mjs). Never in a release.
e2e = []

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "sync", "macros", "rt-multi-thread", "time"] }
# The loopback relay (--relay) to ws:// and wss:// worlds; webpki's roots.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Central's calls and worlds' /status, made by the shell (blocking, on Tauri's blocking pool).
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
# "Remember me": the OS's keychain.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
