[package]
name = "ratw-desktop"
version = "0.0.1"
description = "Run Against the World: the desktop client (docs 76 and 77)."
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "ratw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The end-to-end hook (src/e2e.rs, Desktop/tests/app.test.mjs). Never in a release.
e2e = []

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "sync", "macros", "rt-multi-thread", "time"] }
# The loopback relay (--relay) to ws:// and wss:// worlds; webpki's roots.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Central's calls and worlds' /status, made by the shell (blocking, on Tauri's blocking pool). Pinned exactly: the
# Editor's pinned TLS client (src/editor/tls.rs) builds on `ureq::unversioned`, which may change in any release
# (Docs/Design/78, 6.4; M0a).
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "json"] }
# The Editor (Docs/Design/78, 6.4-6.6): the pinned verifier's SPKI (webpki), its hashes and the signatures it checks
# (ring: ECDSA P-256 for a signed key rotation, Ed25519 for the signed Editor bundle), gzip replies through the proxy.
ring = "0.17"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring", "std"] }
flate2 = "1"
base64 = "0.22"
# The Editor window's downloads go through a save dialog the shell opens (never a dialog plugin the page could call).
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
# "Remember me": the OS's keychain.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
