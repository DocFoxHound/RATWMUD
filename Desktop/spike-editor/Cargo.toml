# Doc 78, Phase M0a: the Editor's spike (read-only measurements). Not part of the client.
# - the `editor` URI scheme proxying the built studio app (Editor/dist) to a TLS 1.3 stand-in world (world_stub.py);
# - ureq 3.5.1's Agent::with_parts with a pinned rustls verifier (TLS 1.3 only) against a self-signed P-256 server.
# Run it with run.sh (Linux) or the workflow editor-spike-windows.yml (Windows). Results: one JSON line a check.
[package]
name = "ratw-editor-spike"
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }
ring = "0.17"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "json"] }
flate2 = "1"
