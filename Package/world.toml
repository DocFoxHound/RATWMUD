# Your world's settings (Hosting.md, section 5). Edit this file with Notepad or any plain-text editor.
# Read whenever the world's server starts: after a change, the Editor's Restart, or `docker compose restart world upnp`
# (the upnp service reads it too).

[world]
# The world's name on the server list and in the game: at most 48 bytes (a plain letter is one, an accented one two).
name = "My Ridgemere"
# A line or two for the server list (300 characters at most).
description = "A friendly world. Everyone welcome."
# Where the world is, roughly, so players can pick a near one (32 characters at most).
region = "Europe"
# Up to 5 tags, 16 characters each at most.
tags = ["friendly", "roleplay"]
# How many wolves can be in the world at once.
player_limit = 40
# New wolves arriving for the first time, at most, per hour (leave it out for the server's own default).
# arrivals_per_hour = 30
# Private worlds (a password kept on central) aren't built yet: leave this false.
private = false
# Cheats (Docs/Design/78, 8). "off" (the default): nobody has any. "host": your Editor's DM tool may give Gifts and
# Gift tiers by hand, and reward your own wolves; players get no cheats. "everyone": EVERY PLAYER can give themselves
# Gifts and goods from nothing, as on a test world. Either of the last two lists the world "cheats on".
cheats = "off"
# This world's id on central, shown on the Host page beside its host token ("world-" and 32 letters and digits).
# Needed when the world is on central (below).
id = ""

[central]
# Central, where players' accounts and wolves live and the server list is kept. Needed: every world signs its players
# in through central (private and LAN worlds come later). During the closed beta this is an example address, not a
# real central: put in the address the game's team gives you with the package.
url = "https://central.example.org"
# The host token, from central's Host page (it starts rh_). Either put it in a .env file beside compose.yaml as
#   RATW_HOST_TOKEN=rh_...
# or in a file of its own beside this one, named here (it may be private to you, chmod 600: the container reads it as
# root):
# token_file = "host-token"
# Without a token the world can still be joined by its address, but it isn't on the server list, you have no host's
# commands in it, and central's ban list doesn't reach it.
# A DNS name that points at this computer, listed instead of its address (optional):
# host = "wolves.example.org"
# True only if the world is reached through wss:// (a proxy with a certificate for the host name above, which it
# then needs).
secure = false

[ai]
# An OpenAI API key lets the residents talk with the model's words (you pay for what they say). Without one they use
# their authored lines, which work well too. The key stays in this container; it is never sent to central.
key = ""
# Or a file holding the key, beside this one (this file and the key's may be chmod 600):
# key_file = "ai-key"
# The models (these defaults are what the official world uses; see Docs/Design/28):
# model = "gpt-5.4-mini"          # the residents' main voice
# light_model = "gpt-5.4-nano"    # short replies
# fallback_model = "gpt-5.4-mini" # when the main one fails
# story_model = "gpt-5.6-luna"    # the stories
# How much talk to buy: generous, balanced or frugal.
cost_mode = "balanced"
# The Editor's tools (life stories, Atlas's rosters) and the residents together use at most this many tokens a month on
# your key (Docs/Design/78, 7). Leave it out for the default (20 million: a few dollars a month at the defaults above).
# monthly_tokens = 20000000

[server]
# The game's worker threads. Leave it out to use the CPUs Docker gives the container, less two (0-16).
# workers = 2


[network]
# The port is set beside compose.yaml, not here: RATW_PORT in .env (default 7788). Players and central reach the
# world on it, so it must be open on your router (TCP, to this computer).
# UPnP: when the world starts, ask the router to forward that port to this computer (for an hour at a time, renewed
# while the world runs, and removed when it stops). It can only work on Linux with Docker Engine; under Docker
# Desktop or rootless Docker, behind carrier-grade NAT, or with UPnP off on the router it can't, and
# `docker compose logs upnp` says so: then forward the port by hand. Central's call-back says whether it is open.
upnp = true

[editor]
# The Editor: your world's own DM tool (and later its map editor), from the game's EDITOR button (Hosting.md,
# sections 10-16). false turns it off: nothing then answers on the Editor port.
enabled = true
# Your first Editor account's name (3 to 32 small letters, digits, - or _). Leave it out and the world makes one up
# (host- and four letters and digits). Either way the name, a one-time password and an Editor code appear in
# manage/first-editor.txt the first time the world starts. Never put a password in this file.
# owner = "myname"
# "open": anyone with an Editor account's name and password can sign in. "approve": a computer that hasn't signed in
# before also needs an Editor code (docker compose exec world ratw-editor invite NAME). Recommended if you open the
# Editor port to the internet.
new_devices = "open"
